name: catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Unit tests
        run: python3 -m unittest tests.test_catalog -v

      - name: Check out hivemill at the pinned sha
        run: |
          sha="$(python3 -c 'import json; print(json.load(open("catalog/catalog.json"))["source"]["sha"])')"
          git clone --quiet https://github.com/volekerb/hivemill "$RUNNER_TEMP/hivemill"
          git -C "$RUNNER_TEMP/hivemill" checkout --quiet "$sha"

      - name: Catalog matches the pinned source
        run: python3 tools/catalog.py check --src "$RUNNER_TEMP/hivemill"

      - name: Snippets resolve (paths and raw URLs)
        run: python3 tools/catalog.py verify-snippets --src "$RUNNER_TEMP/hivemill" --network

      - name: Report when the pin is behind hivemill main
        if: github.event_name == 'schedule'
        run: |
          git -C "$RUNNER_TEMP/hivemill" checkout --quiet origin/HEAD
          python3 tools/catalog.py build --src "$RUNNER_TEMP/hivemill" --out "$RUNNER_TEMP/main-catalog.json"
          pinned="$(python3 -c 'import json; print(json.load(open("catalog/catalog.json"))["source"]["sha"])')"
          latest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"]["sha"])' "$RUNNER_TEMP/main-catalog.json")"
          if [ "$pinned" != "$latest" ]; then
            echo "catalog behind main: pinned $pinned, hivemill main is $latest"
          fi
